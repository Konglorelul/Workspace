replicaCount: 1

image:
  registry: docker.io
  repository: docker.io/library/redis
  tag: "7.2-alpine"
  pullPolicy: IfNotPresent

containerPort: 6379
externalPort: 30487
replicaCount: 1

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

persistence:
  enabled: false
  size: 1Gi
  storageClass: ""

config:
  maxmemory: "100mb"
  maxmemory-policy: "allkeys-lru"